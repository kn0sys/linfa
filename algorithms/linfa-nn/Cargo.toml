[package]
name = "kn0sys-nn"
version = "0.9.2"
authors = ["YuhanLiin <yuhanliin+github@protonmail.com>, Nigel Christian <nigel.christian@hiahatf.org>"]
edition = "2021"
description = "A collection of nearest neighbour algorithms"
license = "MIT OR Apache-2.0"

repository = "https://github.com/kn0sys/linfa"
readme = "README.md"

keywords = ["nearest-neighbour", "machine-learning", "linfa"]
categories = ["algorithms", "mathematics", "science"]

[features]
default = []
serde = ["dep:serde_crate", "ndarray/serde"]

[dependencies.serde_crate]
package = "serde"
optional = true
version = "1.0"
default-features = false
features = ["std", "derive"]

[dependencies]
ndarray = { version = "0.17", features = ["approx"]}
ndarray-stats = { version = "0.7" }
num-traits = "0.2.0"
noisy_float = "0.2.0"
order-stat = "0.1.3"
thiserror = "2.0.3"

kdtree = "0.7.0"

linfa = { version = "0.7.0", path = "../.." }

[dev-dependencies]
approx = "0.5.1"
criterion = "0.5.1"
rand_xoshiro = "0.7"
ndarray-rand = { version = "0.16" }
linfa = { version = "0.7.0", path = "../..", features = ["benchmarks"] }

[[bench]]
name = "nn"
harness = false
